[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["test-util"] }
