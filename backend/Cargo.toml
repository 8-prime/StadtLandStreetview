[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chrono = "0.4.45"
futures-util = { version = "0.3", features = ["sink"] }
rust-embed = { version = "8.13.0", features = ["debug-embed", "deterministic-timestamps", "interpolate-folder-path", "mime-guess"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
